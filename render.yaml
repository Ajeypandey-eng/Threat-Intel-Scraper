services:
  - type: web
    name: threat-intel-scraper-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://threat-intel-scraper-ui.onrender.com

  - type: web
    name: threat-intel-scraper-ui
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: sh -c "cd frontend && npx serve -s dist -l :$PORT"
    envVars:
      - key: VITE_API_URL
        value: https://threat-intel-scraper-api.onrender.com/api
